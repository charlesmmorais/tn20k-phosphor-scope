<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="monospace">
  <rect x="0" y="0" width="980" height="560" fill="#04140a"/>
  <text x="490" y="34" fill="#7CFC6A" font-size="22" text-anchor="middle" font-weight="bold">Osciloscópio de Fósforo — Arquitetura / Phosphor Scope — Architecture</text>

  <!-- legend / clock domains -->
  <rect x="30" y="58" width="16" height="16" fill="#0a2e18" stroke="#2f7d4f"/>
  <text x="54" y="71" fill="#9fe6a8" font-size="13">domínio 25.2 MHz (pixel)</text>
  <rect x="250" y="58" width="16" height="16" fill="#15300a" stroke="#caa23a"/>
  <text x="274" y="71" fill="#d8c98a" font-size="13">domínio 126 MHz (serial)</text>

  <!-- clk + pll -->
  <rect x="30" y="100" width="120" height="60" rx="6" fill="#082414" stroke="#2f7d4f"/>
  <text x="90" y="126" fill="#bdf2c2" font-size="13" text-anchor="middle">clk27</text>
  <text x="90" y="144" fill="#6fb97f" font-size="11" text-anchor="middle">27 MHz xtal</text>

  <rect x="180" y="95" width="130" height="70" rx="6" fill="#082414" stroke="#2f7d4f"/>
  <text x="245" y="120" fill="#bdf2c2" font-size="13" text-anchor="middle">gowin_rpll</text>
  <text x="245" y="138" fill="#6fb97f" font-size="10" text-anchor="middle">rPLL + CLKDIV/5</text>
  <text x="245" y="152" fill="#6fb97f" font-size="10" text-anchor="middle">→126 + 25.2 MHz</text>

  <line x1="150" y1="130" x2="180" y2="130" stroke="#7CFC6A" stroke-width="2" marker-end="url(#a)"/>

  <!-- control -->
  <rect x="30" y="210" width="120" height="60" rx="6" fill="#082414" stroke="#2f7d4f"/>
  <text x="90" y="236" fill="#bdf2c2" font-size="13" text-anchor="middle">control</text>
  <text x="90" y="254" fill="#6fb97f" font-size="10" text-anchor="middle">botões + auto</text>

  <!-- signal_gen -->
  <rect x="180" y="210" width="150" height="70" rx="6" fill="#082414" stroke="#2f7d4f"/>
  <text x="255" y="236" fill="#bdf2c2" font-size="13" text-anchor="middle">signal_gen</text>
  <text x="255" y="253" fill="#6fb97f" font-size="10" text-anchor="middle">DDS + tabela seno</text>
  <text x="255" y="267" fill="#6fb97f" font-size="10" text-anchor="middle">→ pontos (x,y)</text>

  <line x1="150" y1="240" x2="180" y2="245" stroke="#7CFC6A" stroke-width="2" marker-end="url(#a)"/>

  <!-- beam_plotter -->
  <rect x="360" y="210" width="160" height="70" rx="6" fill="#082414" stroke="#2f7d4f"/>
  <text x="440" y="234" fill="#bdf2c2" font-size="13" text-anchor="middle">beam_plotter</text>
  <text x="440" y="251" fill="#6fb97f" font-size="10" text-anchor="middle">Bresenham +</text>
  <text x="440" y="265" fill="#6fb97f" font-size="10" text-anchor="middle">brilho ∝ 1/veloc.</text>

  <line x1="330" y1="245" x2="360" y2="245" stroke="#7CFC6A" stroke-width="2" marker-end="url(#a)"/>
  <text x="345" y="238" fill="#9fe6a8" font-size="9" text-anchor="middle">(x,y)</text>

  <!-- scope_engine -->
  <rect x="550" y="200" width="170" height="90" rx="6" fill="#082414" stroke="#2f7d4f"/>
  <text x="635" y="226" fill="#bdf2c2" font-size="13" text-anchor="middle">scope_engine</text>
  <text x="635" y="244" fill="#6fb97f" font-size="10" text-anchor="middle">DRAW (+brilho)</text>
  <text x="635" y="258" fill="#6fb97f" font-size="10" text-anchor="middle">DECAY (varre e apaga)</text>
  <text x="635" y="276" fill="#6fb97f" font-size="10" text-anchor="middle">handshake valid/ready</text>

  <line x1="520" y1="245" x2="550" y2="245" stroke="#7CFC6A" stroke-width="2" marker-end="url(#a)"/>

  <!-- framebuffer -->
  <rect x="550" y="330" width="170" height="70" rx="6" fill="#10210a" stroke="#caa23a"/>
  <text x="635" y="356" fill="#e9d79a" font-size="13" text-anchor="middle">framebuffer</text>
  <text x="635" y="373" fill="#b39a52" font-size="10" text-anchor="middle">BSRAM 320×240×4</text>
  <text x="635" y="387" fill="#b39a52" font-size="10" text-anchor="middle">dual-port</text>

  <line x1="635" y1="290" x2="635" y2="330" stroke="#7CFC6A" stroke-width="2" marker-end="url(#a)"/>
  <line x1="648" y1="330" x2="648" y2="290" stroke="#7CFC6A" stroke-width="2" marker-end="url(#a)"/>
  <text x="690" y="315" fill="#9fe6a8" font-size="9">porta B (RMW)</text>

  <!-- video read path -->
  <rect x="360" y="330" width="150" height="70" rx="6" fill="#082414" stroke="#2f7d4f"/>
  <text x="435" y="356" fill="#bdf2c2" font-size="13" text-anchor="middle">video_timing</text>
  <text x="435" y="373" fill="#6fb97f" font-size="10" text-anchor="middle">640×480@60</text>
  <text x="435" y="387" fill="#6fb97f" font-size="10" text-anchor="middle">x,y,hsync,vsync</text>

  <line x1="550" y1="365" x2="510" y2="365" stroke="#7CFC6A" stroke-width="2" marker-end="url(#a)"/>
  <text x="532" y="358" fill="#9fe6a8" font-size="9" text-anchor="middle">porta A</text>

  <!-- colorizer -->
  <rect x="360" y="430" width="150" height="60" rx="6" fill="#082414" stroke="#2f7d4f"/>
  <text x="435" y="456" fill="#bdf2c2" font-size="13" text-anchor="middle">colorizer</text>
  <text x="435" y="474" fill="#6fb97f" font-size="10" text-anchor="middle">verde P31 + grade</text>

  <line x1="435" y1="400" x2="435" y2="430" stroke="#7CFC6A" stroke-width="2" marker-end="url(#a)"/>

  <!-- tmds -->
  <rect x="560" y="430" width="150" height="60" rx="6" fill="#082414" stroke="#2f7d4f"/>
  <text x="635" y="452" fill="#bdf2c2" font-size="13" text-anchor="middle">tmds_encoder ×3</text>
  <text x="635" y="470" fill="#6fb97f" font-size="10" text-anchor="middle">8b/10b (DVI)</text>
  <text x="635" y="484" fill="#6fb97f" font-size="10" text-anchor="middle">R / G / B</text>

  <line x1="510" y1="460" x2="560" y2="460" stroke="#7CFC6A" stroke-width="2" marker-end="url(#a)"/>
  <text x="535" y="452" fill="#9fe6a8" font-size="9" text-anchor="middle">RGB</text>

  <!-- serializer -->
  <rect x="760" y="425" width="180" height="70" rx="6" fill="#10210a" stroke="#caa23a"/>
  <text x="850" y="450" fill="#e9d79a" font-size="13" text-anchor="middle">hdmi_serializer</text>
  <text x="850" y="468" fill="#b39a52" font-size="10" text-anchor="middle">OSER10 + ELVDS</text>
  <text x="850" y="482" fill="#b39a52" font-size="10" text-anchor="middle">10:1 DDR</text>

  <line x1="710" y1="460" x2="760" y2="460" stroke="#caa23a" stroke-width="2" marker-end="url(#b)"/>

  <!-- HDMI out -->
  <rect x="800" y="330" width="120" height="60" rx="6" fill="#1a1206" stroke="#caa23a"/>
  <text x="860" y="356" fill="#e9d79a" font-size="13" text-anchor="middle">HDMI</text>
  <text x="860" y="374" fill="#b39a52" font-size="10" text-anchor="middle">TMDS pairs</text>
  <line x1="850" y1="425" x2="860" y2="390" stroke="#caa23a" stroke-width="2" marker-end="url(#b)"/>

  <text x="490" y="528" fill="#5a8f68" font-size="12" text-anchor="middle">O FPGA modela o feixe de elétrons e o fósforo digitalmente / The FPGA models the electron beam and phosphor digitally.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7CFC6A"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#caa23a"/></marker>
  </defs>
</svg>
